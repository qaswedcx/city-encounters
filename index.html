<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="城市邂逅：適合 iPhone 的原創生活探索與人物關係模擬遊戲。">
  <title>城市邂逅｜生活互動模擬</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark" aria-hidden="true">✳</div><div><h1>城市邂逅</h1><p>在日常裡，收藏相遇。</p></div></div>
    <div class="time-pill" aria-live="polite"><strong id="clock-day">第 1 天</strong><span id="clock-slot">早上</span></div>
  </header>
  <div class="status-bar"><span id="save-status" role="status">正在讀取存檔…</span><button id="btn-guide" type="button">玩法說明 ↗</button></div>
  <div class="storage-warning" id="storage-warning" role="alert" hidden></div>
  <main>
    <section id="screen-map">
      <div class="hero"><div class="hero-copy"><p class="eyebrow">一座城市，無數種可能</p><h2>慢慢走，<br>讓故事發生。</h2><p>從一聲招呼，認識一個人的日常。</p></div><svg class="city-scene" viewBox="0 0 250 190" aria-hidden="true"><circle cx="177" cy="42" r="25" fill="#e7b77e"/><path d="M0 176Q110 137 250 162V190H0Z" fill="#aebfab"/><path d="M7 125h46v53H7z" fill="#c9b5a1"/><path d="M2 125l28-23 28 23" fill="#a87460"/><path d="M71 72h55v100H71z" fill="#e8d9bf"/><path d="M66 72l32-23 32 23" fill="#667e72"/><path d="M146 111h68v64h-68z" fill="#dfb79a"/><path d="M141 111h78v10h-78z" fill="#b07c63"/><path d="M80 84h12v17H80zm24 0h12v17h-12zm-24 28h12v17H80zm24 0h12v17h-12zm-24 29h12v17H80zm24 0h12v17h-12z" fill="#8ba8a0"/><path d="M17 137h12v14H17zm22 0h9v14h-9zm116-7h14v19h-14zm27 0h20v19h-20z" fill="#fff2d7"/><path d="M25 178v-17h14v17m129-3v-18h15v18" fill="#5c776b"/><path d="M233 168v-48m-175 55v-43" stroke="#6e8066" stroke-width="5"/><ellipse cx="232" cy="112" rx="19" ry="28" fill="#7c9b78"/><circle cx="59" cy="128" r="20" fill="#8daa85"/><path d="M110 190q38-22 73-8" fill="none" stroke="#f8f3e5" stroke-width="12"/><path d="M17 50q9-9 18 0m-7 0q9-9 18 0" fill="none" stroke="#8c9d95" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="section-label"><h3>今天，去哪裡走走？</h3><span>移動不消耗時間</span></div><div class="place-grid" id="place-grid"></div>
      <section class="panel" aria-live="polite"><div class="row space-between"><h3 id="place-title">目前地點</h3><button type="button" class="btn secondary" id="btn-wait">⏭ 下一時段</button></div><p class="muted" id="place-description"></p><div id="encounters"></div></section>
    </section>
    <section id="screen-people" hidden><h2 class="section-heading">人物圖鑑</h2><p class="sub">每位人物都有自己的日常作息和關係數值。你可以新增、編輯或隨機產生原創成年角色。</p><div class="people-actions"><button class="btn primary" id="btn-add">＋ 手動新增</button><button class="btn secondary" id="btn-random">🎲 隨機新增</button></div><div id="people-list"></div></section>
    <section id="screen-diary" hidden><h2 class="section-heading">相遇手記</h2><p class="sub">把一點點靠近的過程，留在這裡。</p><div class="tip">進度自動儲存在本機瀏覽器。清除網站資料、使用無痕模式或更換裝置可能遺失進度；建議定期匯出 JSON，存到 iPhone「檔案」。</div><div class="people-actions"><button class="btn primary" id="btn-export">↓ 匯出 JSON 存檔</button><button class="btn secondary" id="btn-import">↑ 匯入 JSON 存檔</button><input type="file" id="import-file" accept=".json,application/json" hidden></div><div class="people-actions"><button class="btn ghost" id="btn-reset">開始新遊戲</button></div><div class="section-label"><h3>相遇日誌</h3><span id="log-count">0 則</span></div><div id="logs"></div></section>
  </main>
</div>
<nav class="nav" aria-label="主要選單"><button class="selected" data-screen="map"><span aria-hidden="true">⌘</span>城市探索</button><button data-screen="people"><span aria-hidden="true">♧</span>人物圖鑑</button><button data-screen="diary"><span aria-hidden="true">▤</span>相遇手記</button></nav>
<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet"><div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="close" id="btn-close" aria-label="關閉">×</button></div><div id="sheet-content"></div></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="js/data.js" defer></script>
<script src="js/life.js" defer></script>
<script src="js/topics.js" defer></script>
<script src="js/talk.js" defer></script>
<script src="js/core.js" defer></script>
<script src="js/editor.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
