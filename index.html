<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="城市邂逅：適合 iPhone 的原創生活探索與人物關係模擬遊戲。">
  <title>城市邂逅｜生活互動模擬</title>
  <link rel="stylesheet" href="styles.css?v=rollout1">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark" aria-hidden="true">✳</div><div><h1>城市邂逅</h1><p>在日常裡，收藏相遇。</p></div></div>
    <div class="time-pill" aria-live="polite"><strong id="clock-day">第 1 天</strong><span id="clock-slot">早上</span></div>
  </header>
  <div class="status-bar"><span id="save-status" role="status">正在讀取存檔…</span><button id="btn-guide" type="button">玩法說明 ↗</button></div>
  <div class="storage-warning" id="storage-warning" role="alert" hidden></div>
  <main>
    <section id="screen-map">
      <div class="town-heading"><div><p class="eyebrow">街角的日常，正在發生</p><h2>在小鎮裡，慢慢走。</h2></div><span class="town-season" aria-hidden="true">TOWN LIFE</span></div>
      <p id="town-help" class="town-help">點建築前往，點頭像看看誰在附近。<br>移動不耗時間，下一時段會更新人物行程。</p>
      <div id="town-map" class="town-map" role="group" aria-label="可點選的小鎮地圖" aria-describedby="town-help"></div>
      <p class="town-legend"><span class="town-location-dot" aria-hidden="true"></span>目前位置<span class="town-legend-line" aria-hidden="true"></span>頭像代表目前可相遇的人物</p>
      <section class="panel" aria-live="polite"><div class="row space-between"><h3 id="place-title" tabindex="-1">目前地點</h3><button type="button" class="btn secondary" id="btn-wait">⏭ 下一時段</button></div><p class="muted" id="place-description"></p><div id="encounters"></div></section>
    </section>
    <section id="screen-people" hidden><h2 class="section-heading">人物圖鑑</h2><p class="sub">三個人，三種城市生活。從相遇開始，慢慢讀懂彼此；更深的檔案會隨信任與共同經歷揭開。</p><div class="people-actions"><button class="btn primary" id="btn-add">＋ 手動新增</button><button class="btn secondary" id="btn-random">🎲 隨機新增</button></div><div id="people-list"></div></section>
    <section id="screen-diary" hidden><h2 class="section-heading">相遇手記</h2><p class="sub">把一點點靠近的過程，留在這裡。</p><div class="tip">進度自動儲存在本機瀏覽器。清除網站資料、使用無痕模式或更換裝置可能遺失進度；建議定期匯出 JSON，存到 iPhone「檔案」。</div><div class="people-actions"><button class="btn primary" id="btn-export">↓ 匯出 JSON 存檔</button><button class="btn secondary" id="btn-import">↑ 匯入 JSON 存檔</button><input type="file" id="import-file" accept=".json,application/json" hidden></div><div class="people-actions"><button class="btn ghost" id="btn-reset">開始新遊戲</button></div><div class="section-label"><h3>相遇日誌</h3><span id="log-count">0 則</span></div><div id="logs"></div></section>
  </main>
</div>
<nav class="nav" aria-label="主要選單"><button class="selected" data-screen="map"><span aria-hidden="true">⌘</span>城市探索</button><button data-screen="people"><span aria-hidden="true">♧</span>人物圖鑑</button><button data-screen="diary"><span aria-hidden="true">▤</span>相遇手記</button></nav>
<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet"><div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="close" id="btn-close" aria-label="關閉">×</button></div><div id="sheet-content"></div></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="js/profiles.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/story-v1.js?v=story2" defer></script>
<script src="js/story.js?v=story2" defer></script>
<script src="js/scene-data.js?v=rollout1" defer></script>
<script src="js/scenes.js?v=rollout1" defer></script>
<script src="js/life.js?v=rollout1" defer></script>
<script src="js/topics.js" defer></script>
<script src="js/ai-memory.js" defer></script>
<script src="js/talk.js" defer></script>
<script src="js/core.js" defer></script>
<script src="js/editor.js?v=story2" defer></script>
<script src="js/ai-chat.js" defer></script>
<script src="js/town.js?v=20261029-alignment" defer></script>
<script src="js/app.js?v=rollout1" defer></script>
</body>
</html>
